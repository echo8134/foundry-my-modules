name: PR release notes

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Check PR release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release planning, packaging and notes
        run: node --test .github/scripts/*.test.mjs
      - name: Check the release notes in the PR description
        run: node .github/scripts/release-notes.mjs --check-pr
