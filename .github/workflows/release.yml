name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: module-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Publish module changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh publish
