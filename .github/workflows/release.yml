name: Release

# A push to main whose module.json carries a version without a release publishes that release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: echo "tag=v$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the release if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          git archive --format=zip -o module.zip HEAD module.json scripts styles lang assets/quests assets/fonts LICENSE README.md
          gh release create "$TAG" module.json module.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
