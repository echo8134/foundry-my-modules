name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: module-release-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Merge the release pull request once its checks pass
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: release-please--branches--main--components--foundry-my-modules
        run: |
          state=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = OPEN ]; then
            gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --auto --squash
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Package the Foundry manifest and ZIP
        run: |
          mkdir dist
          jq --arg version "${TAG#v}" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/module.zip" \
            '.version = $version | .download = $url' module.json > dist/module.json
          git archive --format=zip -o dist/module.zip HEAD scripts styles lang assets LICENSE README.md
          (cd dist && zip -q -X module.zip module.json)
      - name: Upload the assets and publish the draft release
        run: |
          gh release upload "$TAG" dist/module.json dist/module.zip --clobber
          gh release edit "$TAG" --draft=false --latest
